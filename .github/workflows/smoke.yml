name: MudBlazor components on iOS AOT (smoke)

on:
  push:
    branches: [ios-aot-repro-14134]
    paths:
      - smoke/**
      - run-smoke.sh
      - smoke-parse.py
      - .github/workflows/smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders and pokes one MudBlazor component at a time in a MAUI Blazor Hybrid app under Mono full AOT, with the interpreter as the control.
  # `package` is MudBlazor 9.12.0 as shipped; a `patch` builds 9.12.0 from source with that file from patches/ and swaps the DLL in.
  # `interpret-mudblazor` tries a narrower workaround for MudBlazor#6558: AOT-compile everything except MudBlazor, which runs in the interpreter.
  smoke:
    name: ${{ matrix.variant }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: package
          - variant: pr-14136
            patch: decimal-then-double
          # %2C because MSBuild splits -p: values on commas.
          - variant: interpret-mudblazor
            args: -p:MtouchInterpreter=-all%2CMudBlazor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # v9.12.0
      - uses: actions/checkout@v7
        if: matrix.patch
        with:
          repository: MudBlazor/MudBlazor
          ref: e087cf8d745ce1cc24623d84847cf563e09b1373
          path: mudblazor
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: smoke/global.json

      - name: Install workloads
        working-directory: smoke
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          dotnet workload restore MudSmoke.csproj
          dotnet --version

      - name: Build MudBlazor 9.12.0 with ${{ matrix.patch }}
        if: matrix.patch
        run: |
          git -C mudblazor apply "$PWD/patches/${{ matrix.patch }}.patch"
          git -C mudblazor status --short
          dotnet build mudblazor/src/MudBlazor/MudBlazor.csproj -c Release -f net10.0 -p:SkipBunCompile=true -p:Version=9.12.0 --nologo

      # The package keeps its static web assets; only the assembly changes.
      - name: Swap it into the app
        if: matrix.patch
        working-directory: smoke
        run: |
          dotnet restore MudSmoke.csproj -r iossimulator-arm64
          built=../mudblazor/src/MudBlazor/bin/Release/net10.0/MudBlazor.dll
          pkg=${NUGET_PACKAGES:-$HOME/.nuget/packages}/mudblazor/9.12.0/lib/net10.0/MudBlazor.dll
          cp "$built" "$pkg"
          shasum -a 256 "$built" "$pkg"

      - name: Release, ${{ matrix.args && 'MudBlazor interpreted' || 'full AOT' }}
        env:
          CONFIG: Release
          LABEL: ${{ matrix.variant }}
          LOG_DIR: ${{ github.workspace }}/logs/${{ matrix.args && 'release-interpret-mudblazor' || 'release-aot' }}
        run: bash run-smoke.sh ${{ matrix.args }}

      # The control, for the shipped package only. The interpreter changes what gets AOT-compiled, so start from a clean build.
      - name: Release, interpreter
        if: (success() || failure()) && matrix.variant == 'package'
        env:
          CONFIG: Release
          LOG_DIR: ${{ github.workspace }}/logs/release-interpreter
        run: |
          rm -rf smoke/bin smoke/obj
          bash run-smoke.sh -p:MtouchInterpreter=all

      # A crash or hang under the interpreter means the harness is broken, not Mono's AOT.
      - name: Check control
        if: (success() || failure()) && matrix.variant == 'package'
        run: "! grep -qE '[|] (crash|hang|no-start) [|]' logs/release-interpreter/summary.md"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p logs/crash-reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*MudSmoke*' -exec cp {} logs/crash-reports/ \; 2>/dev/null || true
          ls -la logs/crash-reports

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs-${{ matrix.variant }}
          path: logs/
          if-no-files-found: ignore
