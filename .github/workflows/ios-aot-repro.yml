name: iOS AOT repro (MudBlazor#14134)

on:
  push:
    branches: [ios-aot-repro-14134]
    paths:
      - Issue14134.*/**
      - run-sim.sh
      - global.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds run in sequence within a job. Each image gets the iOS workload release that matches its Xcode.
  # macos-26 (Xcode 26.6, iOS 26.5.10318) and macos-15 (Xcode 26.3, iOS 26.2.10233) never got an arm64 runner, so only xcode-27 runs.
  simulator:
    name: ${{ matrix.image }} (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xcode-27
            xcode: "27.1"
            ios: 27.1.10018/10.0.100
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install iOS workload ${{ matrix.ios }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          dotnet workload config --update-mode manifests
          echo '{"microsoft.net.sdk.ios": "${{ matrix.ios }}"}' > rollback.json
          dotnet workload install ios --from-rollback-file rollback.json
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Debug, full AOT
        env:
          CONFIG: Debug
          LOG_DIR: logs/debug-aot
        run: bash run-sim.sh

      - name: Release, full AOT
        if: success() || failure()
        env:
          CONFIG: Release
          LOG_DIR: logs/release-aot
        run: bash run-sim.sh

      # The control. The interpreter changes what gets AOT-compiled, so start from a clean build.
      - name: Debug, interpreter
        if: success() || failure()
        env:
          CONFIG: Debug
          LOG_DIR: logs/debug-interpreter
        run: |
          rm -rf Issue14134.Ios/bin Issue14134.Ios/obj Issue14134.Shapes/bin Issue14134.Shapes/obj
          bash run-sim.sh -p:MtouchInterpreter=all

      # A failure here means the harness is broken, not Mono.
      - name: Check control
        if: success() || failure()
        run: "! grep -q FAIL logs/debug-interpreter/summary.md"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p logs/crash-reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*Issue14134*' -exec cp {} logs/crash-reports/ \; 2>/dev/null || true
          ls -la logs/crash-reports

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.image }}
          path: logs/
          if-no-files-found: ignore
