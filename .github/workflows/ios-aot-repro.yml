name: iOS AOT repro (MudBlazor#14134)

on:
  push:
    branches: [ios-aot-repro-14134]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job running the builds in sequence: macOS arm64 runners are scarce, so parallel jobs can sit unassigned.
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The latest iOS workload needs Xcode 27.1; 26.5.10318 is the release for this image's Xcode 26.6.
      - name: Install iOS workload for Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          dotnet workload config --update-mode manifests
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > rollback.json
          dotnet workload install ios --from-rollback-file rollback.json
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Debug, full AOT
        env:
          CONFIG: Debug
          LOG_DIR: logs/debug-aot
        run: bash run-sim.sh

      - name: Release, full AOT
        if: success() || failure()
        env:
          CONFIG: Release
          LOG_DIR: logs/release-aot
        run: bash run-sim.sh

      # The control. The interpreter changes what gets AOT-compiled, so start from a clean build.
      - name: Debug, interpreter
        if: success() || failure()
        env:
          CONFIG: Debug
          LOG_DIR: logs/debug-interpreter
        run: |
          rm -rf Issue14134.Ios/bin Issue14134.Ios/obj Issue14134.Shapes/bin Issue14134.Shapes/obj
          bash run-sim.sh -p:MtouchInterpreter=all

      # A failure here means the harness is broken, not Mono.
      - name: Check control
        if: success() || failure()
        run: "! grep -q FAIL logs/debug-interpreter/summary.md"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p logs/crash-reports
          cp ~/Library/Logs/DiagnosticReports/Issue14134* logs/crash-reports/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore
