name: iOS AOT repro (MudBlazor#14134)

on:
  push:
    branches: [ios-aot-repro-14134]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: ${{ matrix.config }} ${{ matrix.mode }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        mode: [aot, interpreter]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The latest iOS workload needs Xcode 27.1; 26.5.10318 is the release for this image's Xcode 26.6.
      - name: Install iOS workload for Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          dotnet workload config --update-mode manifests
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > rollback.json
          dotnet workload install ios --from-rollback-file rollback.json
          xcodebuild -version
          dotnet --version
          dotnet workload list

      - name: Run cases
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          if [ "${{ matrix.mode }}" = interpreter ]; then
            bash run-sim.sh -p:MtouchInterpreter=all
          else
            bash run-sim.sh
          fi

      # The interpreter run is the control; a failure there means the harness is broken, not Mono.
      - name: Check control
        if: matrix.mode == 'interpreter'
        run: "! grep -q FAIL logs/summary.md"

      - name: Collect crash reports
        if: always()
        run: cp ~/Library/Logs/DiagnosticReports/Issue14134* logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.config }}-${{ matrix.mode }}
          path: logs/
          if-no-files-found: ignore
